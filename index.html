<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --cream: #eee9dc;
  --red: #8b4741;
  --soft-red: #a06d68;
}

@media (prefers-color-scheme: dark) {
  :root {
    --cream: #262220;
    --red: #d3aaa5;
    --soft-red: #a9827e;
  }
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  cursor: url("https://cdn.cursors-4u.net/previews/tiny-grey-pointer-544443a3-32.webp") 32 32, auto !important;
}

html,
body {
  width: 100%;
  margin: 0;
  background: transparent;
}

body {
  color: var(--red);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 9px;
  line-height: 1.15;
}

a {
  color: inherit;
  text-decoration: none;
}

.widget {
  width: 100%;
}

.track {
  display: grid;
  grid-template-columns: 38px minmax(0, 1fr);
  gap: 5px;
  align-items: center;
  width: 100%;
}

.cover {
  width: 38px;
  height: 38px;
  object-fit: cover;
  filter:
    grayscale(.15)
    sepia(.18)
    saturate(.78)
    brightness(.98)
    contrast(.96);
}

.info {
  min-width: 0;
}

.top {
  display: flex;
  align-items: center;
  gap: 4px;
  min-width: 0;
  margin-bottom: 2px;
}

.status {
  flex-shrink: 0;
  padding: 1px 3px 2px;
  background: var(--red);
  color: var(--cream);
  font-size: 7px;
  line-height: 1;
}

.time {
  overflow: hidden;
  color: var(--soft-red);
  font-size: 7px;
  line-height: 1;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.song {
  display: block;
  overflow: hidden;
  color: var(--red);
  font-size: 9px;
  font-weight: 700;
  line-height: 1.1;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.artist {
  display: block;
  margin-top: 1px;
  overflow: hidden;
  color: var(--soft-red);
  font-size: 8px;
  line-height: 1.1;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.album {
  display: block;
  margin-top: 1px;
  overflow: hidden;
  color: var(--soft-red);
  font-size: 7px;
  line-height: 1.1;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.loading,
.error {
  color: var(--soft-red);
  font-size: 8px;
  line-height: 1.2;
}
</style>
</head>

<body>

<div class="widget">

  <div
    id="loading"
    class="loading"
  >
    loading...
  </div>

  <a
    id="track"
    class="track"
    href="#"
    target="_blank"
    rel="noopener noreferrer"
    hidden
  >

    <img
      id="cover"
      class="cover"
      alt="album cover"
    >

    <div class="info">

      <div class="top">
        <span
          id="status"
          class="status"
        >
          playing
        </span>

        <span
          id="time"
          class="time"
        ></span>
      </div>

      <span
        id="song"
        class="song"
      ></span>

      <span
        id="artist"
        class="artist"
      ></span>

      <span
        id="album"
        class="album"
      ></span>

    </div>

  </a>

</div>

<script>
const LASTFM_USERNAME = "deofi";
const LASTFM_API_KEY = "a2be517f739bcad9ea9b996940c97d0c";
const FALLBACK_COVER = "https://cdn.imgchest.com/files/e47cd02d0ccb.gif";

const loading = document.getElementById("loading");
const track = document.getElementById("track");
const cover = document.getElementById("cover");
const status = document.getElementById("status");
const time = document.getElementById("time");
const song = document.getElementById("song");
const artist = document.getElementById("artist");
const album = document.getElementById("album");

function apiUrl() {
  const params = new URLSearchParams({
    method: "user.getrecenttracks",
    user: LASTFM_USERNAME,
    api_key: LASTFM_API_KEY,
    format: "json",
    limit: "1"
  });

  params.set("_", Date.now());

  return "https://ws.audioscrobbler.com/2.0/?" + params;
}

function imageFor(item) {
  const images = item?.image;

  if (!Array.isArray(images)) {
    return FALLBACK_COVER;
  }

  const usable = images
    .map(image => image?.["#text"])
    .filter(Boolean);

  return usable[usable.length - 1] || FALLBACK_COVER;
}

function artistFor(item) {
  return (
    item?.artist?.["#text"] ||
    item?.artist?.name ||
    "unknown artist"
  );
}

function ago(item) {
  const uts = Number(item?.date?.uts);

  if (!uts) {
    return "";
  }

  const seconds =
    Math.max(
      0,
      Math.floor(Date.now() / 1000) - uts
    );

  if (seconds < 60) {
    return "just now";
  }

  const minutes = Math.floor(seconds / 60);

  if (minutes < 60) {
    return `${minutes}m ago`;
  }

  const hours = Math.floor(minutes / 60);

  if (hours < 24) {
    return `${hours}h ago`;
  }

  const days = Math.floor(hours / 24);

  return `${days}d ago`;
}

async function loadLastfm() {
  try {
    const response = await fetch(apiUrl(), {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error();
    }

    const data = await response.json();

    if (data?.error) {
      throw new Error();
    }

    let item = data?.recenttracks?.track;

    if (Array.isArray(item)) {
      item = item[0];
    }

    if (!item) {
      throw new Error();
    }

    const playing =
      item?.["@attr"]?.nowplaying === "true";

    track.href =
      item?.url ||
      `https://www.last.fm/user/${LASTFM_USERNAME}`;

    cover.src = imageFor(item);

    song.textContent =
      item?.name ||
      "unknown song";

    artist.textContent =
      artistFor(item);

    album.textContent =
      item?.album?.["#text"] ||
      "";

    status.textContent =
      playing
        ? "now"
        : "last";

    time.textContent =
      playing
        ? "playing"
        : ago(item);

    loading.hidden = true;
    track.hidden = false;

  } catch {
    loading.hidden = false;
    loading.className = "error";
    loading.textContent = "last.fm unavailable";
    track.hidden = true;
  }
}

loadLastfm();

setInterval(
  loadLastfm,
  15000
);

window.addEventListener(
  "focus",
  loadLastfm
);

document.addEventListener(
  "visibilitychange",
  () => {
    if (!document.hidden) {
      loadLastfm();
    }
  }
);
</script>

</body>
</html>
