<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root {
  --cream: #eee9dc;
  --red: #8b4741;
  --soft-red: #a06d68;
}

@media (prefers-color-scheme: dark) {
  :root {
    --cream: #262220;
    --red: #d3aaa5;
    --soft-red: #a9827e;
  }
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  cursor: url("https://cdn.cursors-4u.net/previews/tiny-grey-pointer-544443a3-32.webp") 32 32, auto !important;
}

html,
body {
  width: 100%;
  margin: 0;
  padding: 0;
  background: transparent;
}

body {
  color: var(--red);
  font-family: Arial, Helvetica, sans-serif;
  overflow: hidden;
}

a {
  color: inherit;
  text-decoration: none;
}

.widget {
  width: 210px;
  max-width: 100%;
}

.track {
  display: block;
  width: 100%;
}

.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 5px;
}

.status {
  display: inline-block;
  width: max-content;
  padding: 2px 5px 3px;
  background: var(--red);
  color: var(--cream);
  font-size: 8px;
  line-height: 1;
  white-space: nowrap;
}

.time {
  overflow: hidden;
  color: var(--soft-red);
  font-size: 8px;
  line-height: 1;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.track-line {
  display: block;
  width: 100%;
  overflow: hidden;
  font-size: 10px;
  line-height: 1.2;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.song {
  color: var(--red);
  font-weight: 700;
}

.dash {
  color: var(--soft-red);
}

.artist {
  color: var(--soft-red);
}

.loading,
.error {
  color: var(--soft-red);
  font-size: 9px;
  line-height: 1.2;
}
</style>
</head>

<body>

<div class="widget">

  <div id="loading" class="loading">
    loading...
  </div>

  <a
    id="track"
    class="track"
    href="#"
    target="_blank"
    rel="noopener noreferrer"
    hidden
  >

    <div class="top">
      <span id="status" class="status">
        listening to
      </span>

      <span id="time" class="time"></span>
    </div>

    <div class="track-line">
      <span id="song" class="song"></span>
      <span class="dash"> — </span>
      <span id="artist" class="artist"></span>
    </div>

  </a>

</div>

<script>
const LASTFM_USERNAME = "deofi";
const LASTFM_API_KEY = "a2be517f739bcad9ea9b996940c97d0c";

const loading = document.getElementById("loading");
const track = document.getElementById("track");
const status = document.getElementById("status");
const time = document.getElementById("time");
const song = document.getElementById("song");
const artist = document.getElementById("artist");

function apiUrl() {
  const params = new URLSearchParams({
    method: "user.getrecenttracks",
    user: LASTFM_USERNAME,
    api_key: LASTFM_API_KEY,
    format: "json",
    limit: "1"
  });

  params.set("_", Date.now());

  return "https://ws.audioscrobbler.com/2.0/?" + params;
}

function artistFor(item) {
  return (
    item?.artist?.["#text"] ||
    item?.artist?.name ||
    "unknown artist"
  );
}

function ago(item) {
  const uts = Number(item?.date?.uts);

  if (!uts) {
    return "";
  }

  const seconds = Math.max(
    0,
    Math.floor(Date.now() / 1000) - uts
  );

  if (seconds < 60) {
    return "just now";
  }

  const minutes = Math.floor(seconds / 60);

  if (minutes < 60) {
    return `${minutes}m ago`;
  }

  const hours = Math.floor(minutes / 60);

  if (hours < 24) {
    return `${hours}h ago`;
  }

  const days = Math.floor(hours / 24);

  return `${days}d ago`;
}

async function loadLastfm() {
  try {
    const response = await fetch(apiUrl(), {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error();
    }

    const data = await response.json();

    if (data?.error) {
      throw new Error();
    }

    let item = data?.recenttracks?.track;

    if (Array.isArray(item)) {
      item = item[0];
    }

    if (!item) {
      throw new Error();
    }

    const playing =
      item?.["@attr"]?.nowplaying === "true";

    track.href =
      item?.url ||
      `https://www.last.fm/user/${LASTFM_USERNAME}`;

    song.textContent =
      item?.name ||
      "unknown song";

    artist.textContent =
      artistFor(item);

    status.textContent =
      playing
        ? "listening to"
        : "last played";

    time.textContent =
      playing
        ? ""
        : ago(item);

    loading.hidden = true;
    track.hidden = false;

  } catch {
    loading.hidden = false;
    loading.className = "error";
    loading.textContent = "last.fm unavailable";
    track.hidden = true;
  }
}

loadLastfm();

setInterval(loadLastfm, 15000);

window.addEventListener("focus", loadLastfm);

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) {
    loadLastfm();
  }
});
</script>

</body>
</html>
