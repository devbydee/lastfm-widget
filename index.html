<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #30251e;
  --muted: #746658;
  --soft: #9a8a79;
  --cover-bg: #d3c5b0;
  --cover-border: #bba992;
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  width: 100%;
  min-height: 100%;
  background: transparent;
  overflow: hidden;
}

body {
  color: var(--ink);
  font-family: "Work Sans", Arial, Helvetica, sans-serif;
}

a {
  color: inherit;
  text-decoration: none;
}

.lastfm-widget {
  width: 100%;
  min-width: 0;
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr);
  gap: 7px;
  align-items: center;
}

.cover-wrap {
  width: 42px;
  height: 42px;
  overflow: hidden;
  background: var(--cover-bg);
  border: 1px solid var(--cover-border);
}

.cover-wrap img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
  filter:
    grayscale(.12)
    sepia(.24)
    saturate(.76)
    brightness(.98)
    contrast(.94);
}

.track-info {
  min-width: 0;
  overflow: hidden;
}

.now-playing {
  display: block;
  margin: 0 0 1px;
  color: var(--soft);
  font-size: 7px;
  font-weight: 500;
  line-height: 1;
  white-space: nowrap;
}

.song {
  display: block;
  color: var(--ink);
  font-size: 9px;
  font-weight: 700;
  line-height: 1.05;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.artist,
.album {
  display: block;
  color: var(--muted);
  font-size: 7px;
  font-weight: 500;
  line-height: 1.08;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.artist {
  margin-top: 2px;
}

.album {
  margin-top: 1px;
}

.loading,
.error {
  color: var(--soft);
}
</style>
</head>
<body>
<a id="lastfm-link" href="https://www.last.fm/user/deofi" target="_blank" rel="noopener noreferrer">
  <div class="lastfm-widget">
    <div class="cover-wrap">
      <img id="cover" src="https://cdn.imgchest.com/files/e47cd02d0ccb.gif" alt="album cover">
    </div>
    <div class="track-info">
      <div id="status" class="now-playing loading">loading last.fm...</div>
      <div id="song" class="song">...</div>
      <div id="artist" class="artist"></div>
      <div id="album" class="album"></div>
    </div>
  </div>
</a>

<script>
const LASTFM_USERNAME = "deofi";
const LASTFM_API_KEY = "a2be517f739bcad9ea9b996940c97d0c";

const API_URL =
  "https://ws.audioscrobbler.com/2.0/?" +
  "method=user.getrecenttracks" +
  "&user=" + encodeURIComponent(LASTFM_USERNAME) +
  "&api_key=" + encodeURIComponent(LASTFM_API_KEY) +
  "&format=json" +
  "&limit=1";

const coverEl = document.getElementById("cover");
const statusEl = document.getElementById("status");
const songEl = document.getElementById("song");
const artistEl = document.getElementById("artist");
const albumEl = document.getElementById("album");
const linkEl = document.getElementById("lastfm-link");

function sendHeight() {
  window.parent.postMessage(
    {
      type: "d-lastfm-height",
      height: Math.ceil(document.documentElement.scrollHeight)
    },
    "*"
  );
}

function getBestImage(images) {
  if (!Array.isArray(images)) return "";
  const usable = images.map(image => image["#text"]).filter(Boolean);
  return usable[usable.length - 1] || "";
}

async function loadLastfm() {
  try {
    const response = await fetch(API_URL + "&cache=" + Date.now());

    if (!response.ok) {
      throw new Error("Last.fm request failed");
    }

    const data = await response.json();
    const track = data?.recenttracks?.track?.[0];

    if (!track) {
      throw new Error("No track found");
    }

    const isNowPlaying = track["@attr"]?.nowplaying === "true";
    const song = track.name || "unknown song";
    const artist = track.artist?.["#text"] || "unknown artist";
    const album = track.album?.["#text"] || "";
    const image = getBestImage(track.image);

    statusEl.textContent = isNowPlaying ? "now playing" : "last played";
    statusEl.classList.remove("loading", "error");
    songEl.textContent = song;
    artistEl.textContent = artist;
    albumEl.textContent = album ? "album: " + album : "";

    if (image) {
      coverEl.src = image;
    }

    if (track.url) {
      linkEl.href = track.url;
    }

    requestAnimationFrame(sendHeight);
    setTimeout(sendHeight, 150);
  } catch (error) {
    statusEl.textContent = "last.fm unavailable";
    statusEl.classList.remove("loading");
    statusEl.classList.add("error");
    songEl.textContent = "could not load song";
    artistEl.textContent = "";
    albumEl.textContent = "";
    requestAnimationFrame(sendHeight);
  }
}

loadLastfm();
setInterval(loadLastfm, 60000);

window.addEventListener("load", sendHeight);
window.addEventListener("resize", sendHeight);

if ("ResizeObserver" in window) {
  new ResizeObserver(sendHeight).observe(document.body);
}
</script>
</body>
</html>
