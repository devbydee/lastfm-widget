<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      --cream: #eee9dc;
      --red: #8b4741;
      --soft-red: #a06d68;
      --line: rgba(139, 71, 65, .22);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --cream: #262220;
        --red: #d3aaa5;
        --soft-red: #a9827e;
        --line: rgba(211, 170, 165, .2);
      }
    }

    * {
      box-sizing: border-box;
      cursor: url("https://cdn.cursors-4u.net/previews/tiny-grey-pointer-544443a3-32.webp") 32 32, auto !important;
    }

    html,
    body {
      width: 100%;
      margin: 0;
      background: transparent;
    }

    body {
      color: var(--red);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 10px;
      line-height: 1.2;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .widget {
      width: 100%;
    }

    .now {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      margin-bottom: 11px;
    }

    .cover {
      width: 52px;
      height: 52px;
      object-fit: cover;
      display: block;
      filter: grayscale(.2) sepia(.22) saturate(.72) brightness(.98) contrast(.96);
    }

    .now-info {
      min-width: 0;
    }

    .status {
      display: inline-block;
      margin-bottom: 3px;
      padding: 1px 4px 2px;
      background: var(--red);
      color: var(--cream);
      font-size: 8px;
      line-height: 1;
    }

    .song {
      display: block;
      overflow: hidden;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.12;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .artist,
    .album {
      display: block;
      overflow: hidden;
      color: var(--soft-red);
      font-size: 9px;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .artist {
      margin-top: 2px;
    }

    .album {
      margin-top: 1px;
    }

    .recent-label {
      margin: 0 0 5px;
      color: var(--soft-red);
      font-size: 9px;
    }

    .recent {
      display: grid;
      gap: 6px;
    }

    .recent-track {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) auto;
      gap: 7px;
      align-items: center;
      min-width: 0;
    }

    .recent-cover {
      display: block;
      width: 34px;
      height: 34px;
      object-fit: cover;
      filter: grayscale(.2) sepia(.22) saturate(.72) brightness(.98) contrast(.96);
    }

    .recent-info {
      min-width: 0;
    }

    .recent-song {
      display: block;
      overflow: hidden;
      font-size: 10px;
      font-weight: 700;
      line-height: 1.1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .recent-artist {
      display: block;
      margin-top: 1px;
      overflow: hidden;
      color: var(--soft-red);
      font-size: 9px;
      line-height: 1.1;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .time {
      color: var(--soft-red);
      font-size: 8px;
      white-space: nowrap;
    }

    .loading,
    .error {
      color: var(--soft-red);
      font-size: 9px;
    }
  </style>
</head>

<body>
  <div class="widget">
    <div id="loading" class="loading">loading last.fm...</div>

    <a id="now-link" class="now" href="#" target="_blank" rel="noopener noreferrer" hidden>
      <img id="now-cover" class="cover" alt="album cover">

      <div class="now-info">
        <span id="status" class="status">now playing</span>
        <span id="now-song" class="song"></span>
        <span id="now-artist" class="artist"></span>
        <span id="now-album" class="album"></span>
      </div>
    </a>

    <div id="recent-wrap" hidden>
      <div class="recent-label">recently</div>
      <div id="recent" class="recent"></div>
    </div>
  </div>

  <script>
    const LASTFM_USERNAME = "deofi";
    const LASTFM_API_KEY = "YOUR_EXISTING_API_KEY";
    const FALLBACK_COVER = "https://cdn.imgchest.com/files/e47cd02d0ccb.gif";

    const loadingEl = document.getElementById("loading");
    const nowLink = document.getElementById("now-link");
    const nowCover = document.getElementById("now-cover");
    const statusEl = document.getElementById("status");
    const nowSong = document.getElementById("now-song");
    const nowArtist = document.getElementById("now-artist");
    const nowAlbum = document.getElementById("now-album");
    const recentWrap = document.getElementById("recent-wrap");
    const recentEl = document.getElementById("recent");

    function buildApiUrl() {
      const params = new URLSearchParams({
        method: "user.getrecenttracks",
        user: LASTFM_USERNAME,
        api_key: LASTFM_API_KEY,
        format: "json",
        limit: "8"
      });

      params.set("_", Date.now());

      return "https://ws.audioscrobbler.com/2.0/?" + params.toString();
    }

    function normalizeTracks(data) {
      const tracks = data?.recenttracks?.track;

      if (!tracks) return [];

      return Array.isArray(tracks) ? tracks : [tracks];
    }

    function getImage(track) {
      const images = track?.image;

      if (!Array.isArray(images)) return FALLBACK_COVER;

      const usable = images
        .map(image => image?.["#text"])
        .filter(Boolean);

      return usable[usable.length - 1] || FALLBACK_COVER;
    }

    function getArtist(track) {
      return track?.artist?.["#text"] || track?.artist?.name || "unknown artist";
    }

    function timeAgo(track) {
      const uts = Number(track?.date?.uts);

      if (!uts) return "";

      const seconds = Math.max(0, Math.floor(Date.now() / 1000) - uts);

      if (seconds < 60) return "now";

      const minutes = Math.floor(seconds / 60);

      if (minutes < 60) return minutes + "m";

      const hours = Math.floor(minutes / 60);

      if (hours < 24) return hours + "h";

      const days = Math.floor(hours / 24);

      return days + "d";
    }

    function renderNow(track, isPlaying) {
      nowLink.hidden = false;
      nowLink.href = track?.url || "https://www.last.fm/user/" + LASTFM_USERNAME;

      nowCover.src = getImage(track);
      nowSong.textContent = track?.name || "unknown song";
      nowArtist.textContent = getArtist(track);
      nowAlbum.textContent = track?.album?.["#text"] || "";

      statusEl.textContent = isPlaying ? "now playing" : "last played";
    }

    function renderRecent(tracks) {
      recentEl.innerHTML = "";

      tracks.slice(0, 6).forEach(track => {
        const link = document.createElement("a");
        link.className = "recent-track";
        link.href = track?.url || "https://www.last.fm/user/" + LASTFM_USERNAME;
        link.target = "_blank";
        link.rel = "noopener noreferrer";

        const cover = document.createElement("img");
        cover.className = "recent-cover";
        cover.src = getImage(track);
        cover.alt = "";

        const info = document.createElement("div");
        info.className = "recent-info";

        const song = document.createElement("span");
        song.className = "recent-song";
        song.textContent = track?.name || "unknown song";

        const artist = document.createElement("span");
        artist.className = "recent-artist";
        artist.textContent = getArtist(track);

        const time = document.createElement("span");
        time.className = "time";
        time.textContent = timeAgo(track);

        info.append(song, artist);
        link.append(cover, info, time);
        recentEl.appendChild(link);
      });

      recentWrap.hidden = tracks.length === 0;
    }

    async function loadLastfm() {
      try {
        const response = await fetch(buildApiUrl(), {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();

        if (data?.error) {
          throw new Error(data.message || "Last.fm error");
        }

        const tracks = normalizeTracks(data);

        if (!tracks.length) {
          throw new Error("No tracks");
        }

        const first = tracks[0];
        const isPlaying = first?.["@attr"]?.nowplaying === "true";

        renderNow(first, isPlaying);

        const recentTracks = isPlaying
          ? tracks.slice(1)
          : tracks.slice(1);

        renderRecent(recentTracks);

        loadingEl.hidden = true;
      } catch (error) {
        loadingEl.hidden = false;
        loadingEl.className = "error";
        loadingEl.textContent = "last.fm unavailable";
        nowLink.hidden = true;
        recentWrap.hidden = true;
      }
    }

    loadLastfm();

    setInterval(loadLastfm, 15000);

    window.addEventListener("focus", loadLastfm);

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        loadLastfm();
      }
    });
  </script>
</body>
</html>
